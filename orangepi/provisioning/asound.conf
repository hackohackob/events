# Optional: pin the USB sound card as ALSA's default.
#
# Not installed by default — the console's device picker is the better answer,
# because it survives the card enumerating differently after a reboot and it
# shows the operator what was actually chosen. Kept here for boxes where
# something else on the system insists on "default".
#
# Installed to /etc/asound.conf
pcm.!default {
  type asym
  playback.pcm "plughw:1,0"
  capture.pcm "plughw:1,0"
}
ctl.!default {
  type hw
  card 1
}
