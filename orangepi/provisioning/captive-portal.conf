# Captive portal for the setup access point.
#
# NetworkManager runs its own dnsmasq for a shared (hotspot) connection and
# reads extra configuration from this directory. Resolving every name to the
# box's own address is what makes a phone joining "EM-Radio-…" pop the console
# open by itself instead of somebody having to be told an IP address.
#
# Installed to /etc/NetworkManager/dnsmasq-shared.d/captive-portal.conf
address=/#/10.42.0.1

# Phones give up on a portal that answers slowly, and there is no upstream
# resolver to wait for in access-point mode anyway.
no-resolv
